global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets:
        - cadvisor:8080

  - job_name: "app-metrics"
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]
