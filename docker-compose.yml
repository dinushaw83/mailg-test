version: '3.8'

services:
  mailg-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailg-api
    # LOCAL TESTING: uncomment the next line to publish to host for local dev
    # ports:
    #   - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - API_PORT=3001
      - VITE_RUN_MODE=localstorage
    env_file:
      - .env
    command: ["sh", "-c", "node server.js"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mailg-net

  mailg-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailg-frontend
    # LOCAL TESTING: uncomment the next line to publish to host for local dev
    # ports:
    #   - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_PORT=3001
      - VITE_RUN_MODE=localstorage
    env_file:
      - .env
    # Use the serve-frontend.sh created by your Dockerfile
    command: ["sh", "-c", "/app/serve-frontend.sh"]
    depends_on:
      mailg-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - mailg-net

# Shared network so services communicate via DNS (mailg-api, mailg-frontend)
networks:
  mailg-net:
    driver: bridge
