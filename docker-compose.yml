version: '3.8'

services:
  mailg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailg-app
    ports:
      - "3000:3000"  # Single port for both frontend and API
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_RUN_MODE=localstorage
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
