  attachments: 300
  labels: 40
  thread_labels: 500
  email_templates: 30
  saved_searches: 50
  api_logs: 0  # Generated by application at runtime, not seed data

# Value distributions for enum fields
distributions:
  users:
    role:
      admin: 10
      user: 90

  emails:
    status:
      draft: 10
      queued: 2
      sent: 40
      received: 45
      archived: 2
      cancelled: 1
    category:
      primary: 60
      promotions: 15
      social: 10
      updates: 10
      forums: 5

  email_recipients:
    recipient_type:
      to: 70
      cc: 20
      bcc: 10

  attachments:
    attachment_type:
      file: 50
      image: 30
      document: 20

# Enum value lists
enums:
  users:
    role: [admin, user]

  emails:
    status: [draft, queued, sent, received, archived, cancelled]
    category: [primary, promotions, social, updates, forums]

  email_recipients:
    recipient_type: [to, cc, bcc]

  attachments:
    attachment_type: [file, image, document]

  api_logs:
    level: [INFO, WARNING, ERROR]
    operation: [CREATE, READ, UPDATE, DELETE, RESTORE]

# Null probability overrides for specific fields
# Lower values = more fields populated with data
null_probabilities:
  users:
    photo: 0.30                # 70% will have photos
    email_label: 0.10          # 90% will have email labels
    company: 0.15              # 85% will have company
    job_title: 0.20            # 80% will have job title
    phone: 0.10                # 90% will have phone
    phone_country_code: 0.10   # 90% will have phone country code
    phone_label: 0.10          # 90% will have phone label
    address: 0.40              # 60% will have address
    birthday_month: 0.50       # 50% will have birthday month
    birthday_day: 0.50         # 50% will have birthday day
    birthday_year: 0.50        # 50% will have birthday year
    significant_dates: 0.70    # 30% will have significant dates
    website: 0.50              # 50% will have website
    related_persons: 0.60      # 40% will have related persons
    labels: 0.40               # 60% will have labels
    custom_fields: 0.70        # 30% will have custom fields
    notes: 0.50                # 50% will have notes

  emails:
    body: 0.0                 # 100% will have body
    html_body: 0.0            # 100% will have html_body
    thread_id: 0.0             # 100% will have thread_id (required field)
    parent_email_id: 0.70      # Most emails are not replies
    sent_at: 0.50              # Depends on status
    received_at: 0.55          # Depends on status
    snooze_until: 0.95         # 5% will be snoozed
    scheduled_send_at: 0.98    # Only for queued emails

  labels:
    parent_id: 0.80  # Most labels are top-level
    color: 0.30

  threads:
    last_email_at: 0.10

  email_recipients:
    recipient_id: 0.30  # External emails don't have user accounts
    recipient_name: 0.20

  attachments:
    content_type: 0.10
    size_bytes: 0.10
    storage_path: 0.20

  email_templates:
    description: 0.40
    subject: 0.20
    body: 0.10
    html_body: 0.50

  saved_searches:
    filters: 0.30
    last_used_at: 0.40

  # api_logs: not generating seed data for this table

# Semantic type overrides for fields
# Maps table.field to specific semantic types when auto-detection isn't sufficient
semantics:
  users:
    birthday_year: YEAR
    birthday_month: MONTH
    birthday_day: DAY

# Field generation order for context-aware fields
# Fields listed here are generated first, in the specified order
# This enables context-aware generators (e.g., DAY can check YEAR and MONTH for valid range)
field_order:
  users:
    - birthday_year   # First: determines leap year
    - birthday_month  # Second: affects day range
    - birthday_day    # Third: range depends on year and month

# Foreign key settings
foreign_keys:
  self_reference_null_probability: 0.80
  optional_null_probability: 0.25

# Derived fields - fields whose values are derived from other fields
# Supports derivation types:
#   - email_from_name: Generate email from name field (firstname.lastname@domain)
#   - username_from_name: Generate username from name field
#   - html_from_text: Convert plain text to HTML (body → html_body)
derived_fields:
  emails:
    html_body:
      type: html_from_text
      from_field: body
      style: paragraphs  # basic, paragraphs, or rich

  email_templates:
    html_body:
      type: html_from_text
      from_field: body
      style: paragraphs

# Field groups for coordinated null/present behavior
# Fields in a group are either all null or all present together
field_groups:
  users:
    # Birthday month and day should be together (can't have day without month)
    # Year is independent - you might know month/day but not year
    birthday_date:
      fields: [birthday_month, birthday_day]
      null_probability: 0.5

# Field values from config
# Allows specifying value sources for specific fields
# Supports:
#   - source: dot-path to config list (e.g., "samples.label_names")
#   - values: inline list of values
#   - field: extract specific field from list of dicts
#   - unique: ensure uniqueness across generated records
#   - null_probability: chance of returning null (0.0-1.0)
field_values:
  labels:
    name:
      source: samples.label_names
      unique: true
      null_probability: 0

  saved_searches:
    name:
      values:
        - Unread Messages
        - Important Emails
        - Work Emails
        - Emails with Attachments
        - Recent from Client
        - Urgent Items
        - This Week
        - Starred Messages
        - From Boss
        - Team Updates
      unique: true
    query:
      source: samples.search_queries

  attachments:
    filename:
      source: samples.attachments
      field: filename
    content_type:
      source: samples.attachments
      field: content_type

  email_templates:
    name:
      values:
        - Weekly Update Template
        - Meeting Follow-up Template
        - Client Outreach Template
        - Thank You Template
        - Welcome Email Template
        - Project Status Template
        - Invoice Reminder Template
        - Newsletter Template
      unique: true

