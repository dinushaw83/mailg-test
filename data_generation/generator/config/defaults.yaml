# Table-specific default row counts
table_defaults:
  users: 50
  folders: 150  # Custom folders (6 system folders per user already seeded)
  threads: 200
  emails: 1000
  email_recipients: 2500  # Multiple recipients per email
  attachments: 300
  labels: 80
  email_labels: 800
  email_templates: 30
  saved_searches: 50
  api_logs: 0  # Generated by application at runtime, not seed data

# Value distributions for enum fields
distributions:
  users:
    role:
      admin: 10
      user: 90

  emails:
    status:
      draft: 10
      queued: 2
      sent: 40
      received: 45
      archived: 2
      cancelled: 1
    category:
      primary: 60
      promotions: 15
      social: 10
      updates: 10
      forums: 5

  folders:
    folder_type:
      custom: 100  # System folders are seeded separately

  email_recipients:
    recipient_type:
      to: 70
      cc: 20
      bcc: 10

  attachments:
    attachment_type:
      file: 50
      image: 30
      document: 20

# Enum value lists
enums:
  users:
    role: [admin, user]

  emails:
    status: [draft, queued, sent, received, archived, cancelled]
    category: [primary, promotions, social, updates, forums]

  folders:
    folder_type: [inbox, sent, drafts, trash, spam, starred, custom]

  email_recipients:
    recipient_type: [to, cc, bcc]

  attachments:
    attachment_type: [file, image, document]

  api_logs:
    level: [INFO, WARNING, ERROR]
    operation: [CREATE, READ, UPDATE, DELETE, RESTORE]

# Null probability overrides for specific fields
null_probabilities:
  users:
    photo: 0.60
    email_label: 0.20
    company: 0.40
    job_title: 0.45
    phone: 0.30
    phone_country_code: 0.30
    phone_label: 0.30
    address: 0.50
    birthday_month: 0.70
    birthday_day: 0.70
    birthday_year: 0.70
    significant_dates: 0.80
    website: 0.60
    related_persons: 0.70
    labels: 0.50
    custom_fields: 0.80
    notes: 0.60

  emails:
    body: 0.10
    html_body: 0.40
    thread_id: 0.20
    folder_id: 0.10
    parent_email_id: 0.70  # Most emails are not replies
    sent_at: 0.50  # Depends on status
    received_at: 0.55  # Depends on status
    snooze_until: 0.95
    scheduled_send_at: 0.98  # Only for queued emails

  folders:
    parent_folder_id: 0.80  # Most folders are top-level
    color: 0.50
    icon: 0.50

  labels:
    parent_id: 0.80  # Most labels are top-level
    color: 0.30

  threads:
    last_email_at: 0.10

  email_recipients:
    recipient_id: 0.30  # External emails don't have user accounts
    recipient_name: 0.20

  attachments:
    content_type: 0.10
    size_bytes: 0.10
    storage_path: 0.20

  email_templates:
    description: 0.40
    subject: 0.20
    body: 0.10
    html_body: 0.50

  saved_searches:
    filters: 0.30
    last_used_at: 0.40

  # api_logs: not generating seed data for this table

# Foreign key settings
foreign_keys:
  self_reference_null_probability: 0.80
  optional_null_probability: 0.25

# ID registration attributes for FK filtering
id_registration_attributes:
  users:
    - role
  emails:
    - status
    - category
  folders:
    - folder_type

# Assignment constraints
# Limits how many times a single entity can be referenced
assignment_constraints:
  emails:
    # No single user should send more than 20% of total emails
    sender_id:
      max_percentage: 20

  threads:
    # No single user should own more than 25% of threads
    owner_id:
      max_percentage: 25

  folders:
    # Distribute custom folders evenly among users
    owner_id:
      max_percentage: 30

  labels:
    # Distribute labels evenly among users
    owner_id:
      max_percentage: 30

