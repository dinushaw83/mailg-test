# Consistency rules - define field relationships
consistency_rules:
  emails:
    # Queued emails should have scheduled_send_at
    - condition:
        field: status
        equals: queued
      set:
        scheduled_send_at: "generate_future_timestamp(0, 7)"  # 0-7 days in future

    # Sent emails should have sent_at
    - condition:
        field: status
        equals: sent
      set:
        sent_at: "generate_past_timestamp(0, 30)"  # Within last 30 days
        scheduled_send_at: null

    # Received emails should have received_at
    - condition:
        field: status
        equals: received
      set:
        received_at: "generate_past_timestamp(0, 30)"
        scheduled_send_at: null

    # Draft emails shouldn't have sent_at or received_at
    - condition:
        field: status
        equals: draft
      set:
        sent_at: null
        received_at: null
        scheduled_send_at: null

  # email_recipients: no post-generation rules needed
  # (at least one 'to' recipient is enforced during generation)

  threads:
    # last_email_at should be recent
    - condition:
        field: email_count
        greater_than: 0
      set:
        last_email_at: "generate_past_timestamp(0, 30)"
