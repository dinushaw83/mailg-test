# Consistency rules - define field relationships
consistency_rules:
  emails:
    # Queued emails should have scheduled_send_at
    - condition:
        field: status
        equals: queued
      set:
        scheduled_send_at: "generate_timestamp_future(5, 1800)"  # 5s to 30min in future

    # Sent emails should have sent_at
    - condition:
        field: status
        equals: sent
      set:
        sent_at: "generate_timestamp_past(0, 30)"  # Within last 30 days
        scheduled_send_at: null

    # Received emails should have received_at
    - condition:
        field: status
        equals: received
      set:
        received_at: "generate_timestamp_past(0, 30)"
        scheduled_send_at: null

    # Draft emails shouldn't have sent_at or received_at
    - condition:
        field: status
        equals: draft
      set:
        sent_at: null
        received_at: null
        scheduled_send_at: null

  folders:
    # System folders cannot be deleted
    - condition:
        field: is_system
        equals: true
      set:
        is_deleted: false

  # email_recipients: no post-generation rules needed
  # (at least one 'to' recipient is enforced during generation)

  threads:
    # last_email_at should be recent
    - condition:
        field: email_count
        greater_than: 0
      set:
        last_email_at: "generate_timestamp_past(0, 30)"
