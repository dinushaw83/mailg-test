services:

  postgres:
    image: postgres:16-alpine
    container_name: ui-gym-mailg-postgres
    environment:
      - POSTGRES_USER=mailg
      - POSTGRES_PASSWORD=mailg
      - POSTGRES_DB=postgres
      - POSTGRES_MAX_CONNECTIONS=1000
    # Postgres tuning for ~32GB RAM / 32 vCPU host (adjust if your host differs)
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - shared_buffers=8GB
      - -c
      - effective_cache_size=24GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      # CPU/parallelism (32 vCPU)
      - -c
      - max_worker_processes=32
      - -c
      - max_parallel_workers=32
      - -c
      - max_parallel_workers_per_gather=8
      - -c
      - max_parallel_maintenance_workers=8
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mailg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailg -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mailg-backend:latest
    container_name: ui-gym-mailg-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DEVELOPMENT_MODE=${DEVELOPMENT_MODE:-false}
      - DB_BACKEND=postgres
      - DATABASE_URL=postgresql+psycopg2://mailg:mailg@postgres:5432/postgres
      - POSTGRES_ADMIN_DB=postgres
      - POSTGRES_TEMPLATE_DB=mailg_seed
      - POSTGRES_RUN_DB_PREFIX=mailg_
      - UVICORN_WORKERS=1
      # Shared secret for JWT signing/verification
      # IMPORTANT: Set JWT_SECRET_KEY env var to a secure 32+ byte random value in production
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-mailg-local-dev-secret}
      - JWT_ACCESS_TOKEN_TTL_SECONDS=86400
      # OpenTelemetry configuration
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=mailg-backend
      # Prometheus URL for metrics API
      - PROMETHEUS_URL=http://prometheus:9090
    volumes:
      - backend_logs:/app/backend/logs
      - ./backend/fixtures:/seed/fixtures:ro
      - ./data_generation:/app/data_generation:ro
    ports:
      - "8766:8765"
    networks:
      - mailg-network
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8765/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 15s

  mailg:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_INSTRUMENTATION: "${VITE_ENABLE_INSTRUMENTATION:-false}"
    container_name: ui-gym-mailg-frontend
    ports:
      - "3002:3000" 
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_RUN_MODE=localstorage
      # OpenTelemetry configuration
      - VITE_ENABLE_INSTRUMENTATION=${VITE_ENABLE_INSTRUMENTATION:-false}
      - BACKEND_API_URL=${BACKEND_API_URL:-http://localhost:8766/api}
    networks:
      - mailg-network
    restart: unless-stopped
    healthcheck:
      # Use curl (installed in the image) instead of wget
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  # =============================================================================
  # Instrumentation services (enabled with --profile instrumentation)
  # =============================================================================

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["instrumentation"]
    container_name: ui-gym-mailg-cadvisor
    ports:
      - "8090:8080"
    privileged: true
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - mailg-network

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    profiles: ["instrumentation"]
    container_name: ui-gym-mailg-node-exporter
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
    pid: host
    privileged: true
    restart: unless-stopped
    volumes:
      - "/:/host:ro"
    networks:
      - mailg-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["instrumentation"]
    container_name: ui-gym-mailg-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./instrumentation/collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (frontend and backend send here)
      - "9465:9464"   # Prometheus scrape endpoint (collector)
    restart: unless-stopped
    networks:
      - mailg-network

  prometheus:
    image: prom/prometheus:latest
    profiles: ["instrumentation"]
    container_name: ui-gym-mailg-prometheus
    volumes:
      - ./instrumentation/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    restart: unless-stopped
    depends_on:
      - otel-collector
      - cadvisor
      - node_exporter
    networks:
      - mailg-network

  grafana:
    image: grafana/grafana:latest
    profiles: ["instrumentation"]
    container_name: ui-gym-mailg-grafana
    entrypoint: ["sh", "-c", "sh /etc/grafana/init.sh & exec /run.sh"]
    ports:
      - "3000:3000"
    volumes:
      - ./instrumentation/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./instrumentation/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./instrumentation/grafana/dashboards:/var/lib/grafana/dashboards
      - ./instrumentation/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./instrumentation/grafana/init.sh:/etc/grafana/init.sh:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GF_SERVER_SERVE_FROM_SUB_PATH:-false}
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_PASSWORD_CHANGE=true
      - GF_VIEWER_USER=readonly
      - GF_VIEWER_PASSWORD=${GF_VIEWER_PASSWORD:-readonly}
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - mailg-network

networks:
  mailg-network:
    driver: bridge

volumes:
  backend_logs:
  postgres_data:
  prometheus_data:
