name: Build Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set registry owner (lowercase)
        id: registry-owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "Registry owner (lowercase): ${OWNER_LOWER}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false') }}
          tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false') }}
          tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}

      - name: Output image tags
        run: |
          echo "Backend image: ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}"
          echo "Frontend image: ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}"
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Save image tags as artifact
        if: github.event_name != 'pull_request'
        run: |
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}" > image-tags.txt
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}" >> image-tags.txt
          echo "COMMIT_SHA=${{ github.sha }}" >> image-tags.txt
          echo "BRANCH=${{ github.ref_name }}" >> image-tags.txt

      - name: Upload image tags
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-tags
          path: image-tags.txt
          retention-days: 7

