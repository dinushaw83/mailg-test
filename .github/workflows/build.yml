name: Build Docker Images

on:
  push:
    branches:
      - feature/*
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: ${{ secrets.CONTAINER_REGISTRY_URL || 'gcr.io' }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/mailg-backend
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/mailg-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up GCP authentication
        if: env.REGISTRY == 'gcr.io' || contains(env.REGISTRY, 'pkg.dev')
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Configure Docker for GCP
        if: env.REGISTRY == 'gcr.io' || contains(env.REGISTRY, 'pkg.dev')
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Log in to Docker Hub
        if: contains(env.REGISTRY, 'docker.io')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GHCR
        if: contains(env.REGISTRY, 'ghcr.io')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false') }}
          tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/mailg-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false') }}
          tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/mailg-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}

      - name: Output image tags
        run: |
          echo "Backend image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/mailg-backend:${{ github.sha }}"
          echo "Frontend image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/mailg-frontend:${{ github.sha }}"
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/mailg-backend:${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/mailg-frontend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Save image tags as artifact
        if: github.event_name != 'pull_request'
        run: |
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/mailg-backend:${{ github.sha }}" > image-tags.txt
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/mailg-frontend:${{ github.sha }}" >> image-tags.txt
          echo "COMMIT_SHA=${{ github.sha }}" >> image-tags.txt
          echo "BRANCH=${{ github.ref_name }}" >> image-tags.txt

      - name: Upload image tags
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-tags
          path: image-tags.txt
          retention-days: 7

