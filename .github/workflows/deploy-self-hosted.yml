name: Deploy to Self-Hosted Runner

on:
  push:
    branches:
      - feature/*
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: turinggpt

jobs:
  # Run tests before deployment
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend unit tests
        working-directory: ./backend
        run: |
          pytest tests/ -v --cov=app --cov-report=term --cov-report=xml --tb=short
        continue-on-error: false

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend linter
        run: npm run lint || echo "Linter warnings (non-blocking)"

      - name: Build frontend (test build)
        run: npm run build
        continue-on-error: false

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Frontend build successful"

  deploy:
    name: Deploy to Self-Hosted Runner
    runs-on: [self-hosted, linux, x64, mira-vm]
    needs: test
    if: always() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set registry owner (lowercase)
        id: registry-owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "Registry owner: ${OWNER_LOWER}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment
        run: |
          # Ensure directories exist before Docker mounts them
          mkdir -p databases backend/logs
          
          # Clean up only __pycache__ directories (not entire system)
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          
          # Fix ownership if needed (non-destructive)
          if [ -n "$(find . -not -user $(whoami) 2>/dev/null | head -1)" ]; then
            sudo chown -R $(whoami):$(whoami) . 2>/dev/null || true
          fi
          
          # Ensure permissions are correct
          chmod -R 755 databases backend/logs 2>/dev/null || true

      - name: Pull latest images from registry
        run: |
          IMAGE_TAG="${IMAGE_TAG:-${{ github.sha }}}"
          BACKEND_IMAGE="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${IMAGE_TAG}"
          FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${IMAGE_TAG}"
          
          echo "Pulling backend image: ${BACKEND_IMAGE}"
          docker pull "${BACKEND_IMAGE}" || echo "⚠️ Backend image not found, will build locally"
          
          echo "Pulling frontend image: ${FRONTEND_IMAGE}"
          docker pull "${FRONTEND_IMAGE}" || echo "⚠️ Frontend image not found, will build locally"

      - name: Stop existing containers (graceful)
        run: |
          # Stop containers gracefully with timeout
          docker-compose down --timeout 30 || true
          
          # Remove only stopped containers (not all images)
          docker container prune -f || true

      - name: Deploy with Docker Compose
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}
        run: |
          BACKEND_IMG="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}"
          FRONTEND_IMG="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}"
          
          # Check if pre-built images exist
          if docker image inspect "${BACKEND_IMG}" >/dev/null 2>&1 && \
             docker image inspect "${FRONTEND_IMG}" >/dev/null 2>&1; then
            echo "✅ Using pre-built images from registry"
            # Create docker-compose override to use pre-built images
            cat > docker-compose.override.yml <<EOF
          services:
            backend:
              image: ${BACKEND_IMG}
              build: null
            mailg:
              image: ${FRONTEND_IMG}
              build: null
          EOF
            docker-compose -f docker-compose.yaml -f docker-compose.override.yml up -d
            rm -f docker-compose.override.yml
          else
            echo "⚠️ Pre-built images not found, building locally..."
            docker-compose build --parallel
            docker-compose up -d
          fi

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 10
          
          # Check backend health
          MAX_ATTEMPTS=30
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if curl -fsS http://localhost:8766/health >/dev/null 2>&1; then
              echo "✅ Backend is healthy"
              break
            fi
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "❌ Backend health check failed after $MAX_ATTEMPTS attempts"
              docker-compose logs backend --tail 50
              exit 1
            fi
            echo "Waiting for backend... ($ATTEMPT/$MAX_ATTEMPTS)"
            sleep 2
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          # Check frontend health
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if curl -fsS http://localhost:3002/api/health >/dev/null 2>&1; then
              echo "✅ Frontend is healthy"
              break
            fi
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "❌ Frontend health check failed after $MAX_ATTEMPTS attempts"
              docker-compose logs mailg --tail 50
              exit 1
            fi
            echo "Waiting for frontend... ($ATTEMPT/$MAX_ATTEMPTS)"
            sleep 2
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Verify deployment
        run: |
          echo "📊 Container Status:"
          docker-compose ps
          
          echo ""
          echo "✅ Deployment successful!"
          echo "Services:"
          echo "  - Backend:  http://localhost:8766"
          echo "  - Frontend: http://localhost:3002"

      - name: Cleanup old images (optional)
        if: success()
        run: |
          # Remove only dangling images (not all unused images)
          docker image prune -f || true
          
          # Optional: Remove images older than 7 days (uncomment if needed)
          # docker image prune -a --filter "until=168h" -f || true
