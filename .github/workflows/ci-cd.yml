name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - feature/*
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  VM_HOST: ${{ secrets.GCP_VM_HOST }}
  VM_USER: ${{ secrets.GCP_VM_USER }}
  DEPLOY_DIR: ~/mailg-deploy

jobs:
  # Test Stage - Run tests in parallel
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend Tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend unit tests
        working-directory: ./backend
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --tb=short
        continue-on-error: false

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

      # Frontend Tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend linter
        run: npm run lint || echo "Linter warnings (non-blocking)"

      - name: Build frontend (test build)
        run: npm run build
        continue-on-error: false

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Frontend build successful"

      # Integration Tests (Dockerfile validation)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Dockerfiles
        run: |
          echo "Checking backend Dockerfile..."
          docker buildx build --load -f ./backend/Dockerfile ./backend -t test-backend || exit 1
          
          echo "Checking frontend Dockerfile..."
          docker buildx build --load -f ./Dockerfile . -t test-frontend || exit 1
          
          echo "✓ All Dockerfiles build successfully"

      - name: Verify docker-compose configuration
        run: |
          docker compose config > /dev/null || exit 1
          echo "✓ docker-compose.yaml is valid"

  # Build Stage - Build and push images to GHCR
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set registry owner (lowercase)
        id: registry-owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "Registry owner (lowercase): ${OWNER_LOWER}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}

      - name: Output image tags
        id: image-tags
        run: |
          BACKEND_IMG="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}"
          FRONTEND_IMG="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}"
          
          echo "Backend image: ${BACKEND_IMG}"
          echo "Frontend image: ${FRONTEND_IMG}"
          
          echo "backend_image=${BACKEND_IMG}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
    outputs:
      backend_image: ${{ steps.image-tags.outputs.backend_image }}
      frontend_image: ${{ steps.image-tags.outputs.frontend_image }}
      commit_sha: ${{ steps.image-tags.outputs.commit_sha }}

  # Deploy Stage - Deploy to GCP VM
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build
    if: |
      always() && 
      needs.build.result == 'success' && 
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/') || github.event_name == 'workflow_dispatch')
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set registry owner (lowercase)
        id: registry-owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Set up GCP authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Set image tags
        id: image-tags
        run: |
          # Use image tags from build job output, with fallback
          BACKEND_IMG="${{ needs.build.outputs.backend_image }}"
          FRONTEND_IMG="${{ needs.build.outputs.frontend_image }}"
          COMMIT_SHA="${{ needs.build.outputs.commit_sha }}"
          
          # Fallback to constructing tags if outputs not available
          if [ -z "${BACKEND_IMG}" ]; then
            REGISTRY="${{ env.REGISTRY }}"
            OWNER="${{ steps.registry-owner.outputs.owner }}"
            SHA="${{ github.sha }}"
            BACKEND_IMG="${REGISTRY}/${OWNER}/mailg-backend:${SHA}"
            FRONTEND_IMG="${REGISTRY}/${OWNER}/mailg-frontend:${SHA}"
            COMMIT_SHA="${SHA}"
          fi
          
          echo "backend_image=${BACKEND_IMG}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          
          echo "Using backend image: ${BACKEND_IMG}"
          echo "Using frontend image: ${FRONTEND_IMG}"

      - name: Copy deployment files to VM
        run: |
          scp -r deploy/gcp/* ${{ env.VM_USER }}@${{ env.VM_HOST }}:${{ env.DEPLOY_DIR }}/
          scp docker-compose.yaml ${{ env.VM_USER }}@${{ env.VM_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.prod.yaml

      - name: Deploy to VM
        run: |
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} << EOF
            set -e
            cd ${{ env.DEPLOY_DIR }}
            
            # Export image tags from GHCR
            export BACKEND_IMAGE="${{ steps.image-tags.outputs.backend_image }}"
            export FRONTEND_IMAGE="${{ steps.image-tags.outputs.frontend_image }}"
            export GCP_PROJECT_ID="${{ env.GCP_PROJECT_ID }}"
            
            # Log in to GHCR on VM
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            
            # Make scripts executable
            chmod +x deploy-from-registry.sh || true
            
            # Update docker-compose.prod.yaml with image tags
            if [ -f docker-compose.prod.yaml ]; then
              # Use sed to update image tags in docker-compose.prod.yaml
              sed -i "s|image:.*mailg-backend.*|image: \${BACKEND_IMAGE}|g" docker-compose.prod.yaml || true
              sed -i "s|image:.*mailg-frontend.*|image: \${FRONTEND_IMAGE}|g" docker-compose.prod.yaml || true
            fi
            
            # Pull images from GHCR
            docker pull "\${BACKEND_IMAGE}" || echo "Warning: Failed to pull backend image"
            docker pull "\${FRONTEND_IMAGE}" || echo "Warning: Failed to pull frontend image"
            
            # Stop existing containers
            docker-compose -f docker-compose.prod.yaml down --timeout 30 || true
            
            # Start services with new images
            BACKEND_IMAGE="\${BACKEND_IMAGE}" FRONTEND_IMAGE="\${FRONTEND_IMAGE}" \
            docker-compose -f docker-compose.prod.yaml up -d
            
            # Wait for services to start
            sleep 15
          EOF

      - name: Verify deployment
        run: |
          echo "Waiting for services to be ready..."
          sleep 10
          
          # Check backend health
          BACKEND_URL="http://${{ env.VM_HOST }}:8766/health"
          MAX_ATTEMPTS=30
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if curl -fsS "$BACKEND_URL" > /dev/null 2>&1; then
              echo "✅ Backend is healthy"
              break
            fi
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "❌ Backend health check failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Waiting for backend... ($ATTEMPT/$MAX_ATTEMPTS)"
            sleep 2
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          # Check frontend health
          FRONTEND_URL="http://${{ env.VM_HOST }}:3002/api/health"
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if curl -fsS "$FRONTEND_URL" > /dev/null 2>&1; then
              echo "✅ Frontend is healthy"
              break
            fi
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "❌ Frontend health check failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Waiting for frontend... ($ATTEMPT/$MAX_ATTEMPTS)"
            sleep 2
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Successful" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.image-tags.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image:** \`${{ steps.image-tags.outputs.backend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image:** \`${{ steps.image-tags.outputs.frontend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: http://${{ env.VM_HOST }}:3002" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: http://${{ env.VM_HOST }}:8766" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Health: http://${{ env.VM_HOST }}:8766/health" >> $GITHUB_STEP_SUMMARY

