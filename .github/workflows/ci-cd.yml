name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - feature/*
      - bugfix/*
      - hotfix/*
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: 'false'
        type: boolean

# Consolidated environment variables
env:
  REGISTRY: ghcr.io
  # Optional: Only needed if using GCP Container Registry instead of GHCR
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  # Required: SSH connection details for VM deployment
  VM_HOST: ${{ secrets.GCP_VM_HOST }}
  VM_USER: ${{ secrets.GCP_VM_USER }}
  DEPLOY_DIR: ~/mailg-deploy
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  BACKEND_PORT: 8766
  FRONTEND_PORT: 3002

jobs:
  # ============================================================================
  # STAGE 1: CODE VERIFICATION & QUALITY GATE
  # Runs on ALL branches: feature/*, bugfix/*, hotfix/*, dev
  # ============================================================================
  
  # Backend Build & Test
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend linter (flake8)
        working-directory: ./backend
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Linter warnings (non-blocking)"

      - name: Run backend unit tests
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ env.PYTHONPATH }}
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --tb=short

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

  # Frontend Build (runs in parallel with frontend-lint)
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Frontend build successful"

  # Frontend Lint & Test (runs in parallel with frontend-build)
  frontend-lint:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend linter
        run: npm run lint || echo "Linter warnings (non-blocking)"

      - name: Run frontend tests
        run: npm run test --if-present || echo "No tests configured"

  # Docker Build Verification (Integration Test)
  docker-build-verification:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Dockerfiles build
        run: |
          echo "Checking backend Dockerfile..."
          docker buildx build --load -f ./backend/Dockerfile ./backend -t test-backend || exit 1
          
          echo "Checking frontend Dockerfile..."
          docker buildx build --load -f ./Dockerfile . -t test-frontend || exit 1
          
          echo "✓ All Dockerfiles build successfully"

      - name: Verify docker-compose configuration
        run: |
          docker compose config > /dev/null || exit 1
          echo "✓ docker-compose.yaml is valid"

  # Quality Gate Summary
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [backend-build-test, frontend-build, frontend-lint, docker-build-verification]
    if: always() && github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Check quality gate results
        run: |
          BACKEND_RESULT="${{ needs.backend-build-test.result }}"
          FRONTEND_BUILD_RESULT="${{ needs.frontend-build.result }}"
          FRONTEND_LINT_RESULT="${{ needs.frontend-lint.result }}"
          DOCKER_RESULT="${{ needs.docker-build-verification.result }}"
          
          echo "=== Quality Gate Results ==="
          echo "Backend Build & Test: $BACKEND_RESULT"
          echo "Frontend Build: $FRONTEND_BUILD_RESULT"
          echo "Frontend Lint & Test: $FRONTEND_LINT_RESULT"
          echo "Docker Build Verification: $DOCKER_RESULT"
          echo "============================"
          
          if [ "$BACKEND_RESULT" != "success" ]; then
            echo "❌ Backend build/tests failed"
            exit 1
          fi
          if [ "$FRONTEND_BUILD_RESULT" != "success" ]; then
            echo "❌ Frontend build failed"
            exit 1
          fi
          if [ "$FRONTEND_LINT_RESULT" != "success" ]; then
            echo "❌ Frontend lint/tests failed"
            exit 1
          fi
          if [ "$DOCKER_RESULT" != "success" ]; then
            echo "❌ Docker build verification failed"
            exit 1
          fi
          echo "✅ Quality Gate PASSED - All checks successful"

      - name: Quality gate summary
        if: always()
        run: |
          BACKEND_RESULT="${{ needs.backend-build-test.result }}"
          FRONTEND_BUILD_RESULT="${{ needs.frontend-build.result }}"
          FRONTEND_LINT_RESULT="${{ needs.frontend-lint.result }}"
          DOCKER_RESULT="${{ needs.docker-build-verification.result }}"
          
          echo "## 🔍 Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "$BACKEND_RESULT" == "success" ]; then
            echo "| Backend Build & Test | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Backend Build & Test | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$FRONTEND_BUILD_RESULT" == "success" ]; then
            echo "| Frontend Build | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend Build | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$FRONTEND_LINT_RESULT" == "success" ]; then
            echo "| Frontend Lint & Test | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend Lint & Test | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$DOCKER_RESULT" == "success" ]; then
            echo "| Docker Build Verification | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Docker Build Verification | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # STAGE 2: BUILD & PUSH TO GHCR
  # Only runs on: dev branch (push/merge)
  # ============================================================================
  
  build-and-push:
    name: Build and Push Images to GHCR
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build, frontend-lint, docker-build-verification]
    # Only run on dev branch push (not PRs, not feature/bugfix/hotfix branches)
    if: |
      always() && 
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      (needs.backend-build-test.result == 'success' || github.event.inputs.skip_tests == 'true') &&
      (needs.frontend-build.result == 'success' || github.event.inputs.skip_tests == 'true') &&
      (needs.frontend-lint.result == 'success' || github.event.inputs.skip_tests == 'true') &&
      (needs.docker-build-verification.result == 'success' || github.event.inputs.skip_tests == 'true')
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: ./Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Set registry owner (lowercase)
        id: registry-owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-${{ matrix.image.name }}:${{ github.sha }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-${{ matrix.image.name }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-${{ matrix.image.name }}:buildcache,mode=max
          build-args: |
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}

      - name: Output ${{ matrix.image.name }} image tag
        run: |
          IMG="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-${{ matrix.image.name }}:${{ github.sha }}"
          echo "Built and pushed ${{ matrix.image.name }} image: ${IMG}"

  # Collect build outputs for deployment
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success'
    timeout-minutes: 2
    
    steps:
      - name: Set registry owner (lowercase)
        id: registry-owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Collect image tags
        id: image-tags
        run: |
          BACKEND_IMG="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}"
          FRONTEND_IMG="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}"
          
          echo "backend_image=${BACKEND_IMG}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          
          echo "Backend image: ${BACKEND_IMG}"
          echo "Frontend image: ${FRONTEND_IMG}"

      - name: Build summary
        run: |
          echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images pushed to GHCR:**" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

    outputs:
      backend_image: ${{ steps.image-tags.outputs.backend_image }}
      frontend_image: ${{ steps.image-tags.outputs.frontend_image }}
      commit_sha: ${{ steps.image-tags.outputs.commit_sha }}

  # ============================================================================
  # STAGE 3: DEPLOY TO GCP VM
  # Only runs on: dev branch (push/merge) after successful build
  # ============================================================================
  
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-summary
    # Only deploy on dev branch push (after successful GHCR push)
    if: |
      always() && 
      needs.build-summary.result == 'success' && 
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set registry owner (lowercase)
        id: registry-owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Set image tags
        id: image-tags
        run: |
          BACKEND_IMG="${{ needs.build-summary.outputs.backend_image }}"
          FRONTEND_IMG="${{ needs.build-summary.outputs.frontend_image }}"
          COMMIT_SHA="${{ needs.build-summary.outputs.commit_sha }}"
          
          # Fallback to constructing tags if outputs not available
          if [ -z "${BACKEND_IMG}" ]; then
            REGISTRY="${{ env.REGISTRY }}"
            OWNER="${{ steps.registry-owner.outputs.owner }}"
            SHA="${{ github.sha }}"
            BACKEND_IMG="${REGISTRY}/${OWNER}/mailg-backend:${SHA}"
            FRONTEND_IMG="${REGISTRY}/${OWNER}/mailg-frontend:${SHA}"
            COMMIT_SHA="${SHA}"
          fi
          
          echo "backend_image=${BACKEND_IMG}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          
          echo "Using backend image: ${BACKEND_IMG}"
          echo "Using frontend image: ${FRONTEND_IMG}"

      - name: Pre-deployment checks
        run: |
          echo "Running pre-deployment checks..."
          if [ -z "${{ secrets.GCP_SSH_PRIVATE_KEY }}" ]; then
            echo "❌ GCP_SSH_PRIVATE_KEY secret is not set"
            echo "Please configure the GCP_SSH_PRIVATE_KEY secret in your repository settings:"
            echo "  Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          if [ -z "${{ env.VM_HOST }}" ]; then
            echo "❌ GCP_VM_HOST secret is not set"
            echo "Please configure the GCP_VM_HOST secret with your VM IP address or hostname"
            exit 1
          fi
          if [ -z "${{ env.VM_USER }}" ]; then
            echo "❌ GCP_VM_USER secret is not set"
            echo "Please configure the GCP_VM_USER secret with your SSH username"
            exit 1
          fi
          echo "✅ Pre-deployment checks passed"
          echo "  - SSH key: configured"
          echo "  - VM host: ${{ env.VM_HOST }}"
          echo "  - VM user: ${{ env.VM_USER }}"

      - name: Prepare and copy deployment files to VM
        run: |
          # Create deploy directory on remote VM (use $HOME for proper expansion)
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} 'mkdir -p $HOME/mailg-deploy'
          
          # Copy all deployment scripts and production docker-compose
          # Note: deploy/gcp/ already contains docker-compose.prod.yaml configured for production
          # (uses image: instead of build:, so no source code needed on VM)
          scp -r deploy/gcp/* ${{ env.VM_USER }}@${{ env.VM_HOST }}:~/mailg-deploy/
          
          # Verify files were copied successfully
          echo "Verifying files on remote VM..."
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} 'ls -la $HOME/mailg-deploy/'

      - name: Deploy to VM
        id: deploy
        run: |
          BACKEND_IMG="${{ steps.image-tags.outputs.backend_image }}"
          FRONTEND_IMG="${{ steps.image-tags.outputs.frontend_image }}"
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          GITHUB_ACTOR="${{ github.actor }}"
          
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} bash -s << EOF
            set -e
            cd \$HOME/mailg-deploy
            
            echo "Current directory: \$(pwd)"
            echo "Files in deploy directory:"
            ls -la
            
            # Make script executable
            chmod +x deploy-from-registry.sh
            
            # Login to GHCR on the VM
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin || echo "GHCR login failed, continuing..."
            
            # Run deployment script with image tags
            BACKEND_IMAGE="${BACKEND_IMG}" \
            FRONTEND_IMAGE="${FRONTEND_IMG}" \
            GITHUB_TOKEN="${GITHUB_TOKEN}" \
            GITHUB_ACTOR="${GITHUB_ACTOR}" \
            ./deploy-from-registry.sh
          EOF


      - name: Verify deployment with retries
        id: health-check
        run: |
          echo "Waiting for services to be ready..."
          sleep 10
          
          # Health check function with exponential backoff
          check_health() {
            local SERVICE=$1
            local URL=$2
            local MAX_ATTEMPTS=30
            local ATTEMPT=1
            local WAIT_TIME=2
            
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              if curl -fsS --max-time 5 "$URL" > /dev/null 2>&1; then
                echo "✅ $SERVICE is healthy"
                return 0
              fi
              
              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "❌ $SERVICE health check failed after $MAX_ATTEMPTS attempts"
                return 1
              fi
              
              echo "Waiting for $SERVICE... ($ATTEMPT/$MAX_ATTEMPTS)"
              sleep $WAIT_TIME
              ATTEMPT=$((ATTEMPT + 1))
              # Exponential backoff: 2s, 4s, 8s, then cap at 10s
              WAIT_TIME=$((WAIT_TIME * 2))
              if [ $WAIT_TIME -gt 10 ]; then
                WAIT_TIME=10
              fi
            done
          }
          
          # Check backend health
          BACKEND_URL="http://${{ env.VM_HOST }}:${{ env.BACKEND_PORT }}/health"
          if ! check_health "Backend" "$BACKEND_URL"; then
            echo "backend_healthy=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "backend_healthy=true" >> $GITHUB_OUTPUT
          
          # Check frontend health
          FRONTEND_URL="http://${{ env.VM_HOST }}:${{ env.FRONTEND_PORT }}/api/health"
          if ! check_health "Frontend" "$FRONTEND_URL"; then
            echo "frontend_healthy=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "frontend_healthy=true" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        run: |
          STATUS="✅ Successful"
          if [ "${{ steps.health-check.outcome }}" != "success" ]; then
            STATUS="❌ Failed"
          fi
          
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.image-tags.outputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ steps.image-tags.outputs.backend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ steps.image-tags.outputs.frontend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: http://${{ env.VM_HOST }}:${{ env.FRONTEND_PORT }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: http://${{ env.VM_HOST }}:${{ env.BACKEND_PORT }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Health: http://${{ env.VM_HOST }}:${{ env.BACKEND_PORT }}/health" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # WORKFLOW DISPATCH: Manual deployment (for production releases)
  # ============================================================================
  
  manual-deploy:
    name: Manual Deploy (Workflow Dispatch)
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build, frontend-lint, docker-build-verification]
    # Only run on manual workflow dispatch
    if: |
      github.event_name == 'workflow_dispatch' &&
      (needs.backend-build-test.result == 'success' || github.event.inputs.skip_tests == 'true') &&
      (needs.frontend-build.result == 'success' || github.event.inputs.skip_tests == 'true') &&
      (needs.frontend-lint.result == 'success' || github.event.inputs.skip_tests == 'true') &&
      (needs.docker-build-verification.result == 'success' || github.event.inputs.skip_tests == 'true')
    timeout-minutes: 45
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Set registry owner (lowercase)
        id: registry-owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:manual-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:manual-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare and copy deployment files to VM
        run: |
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} 'mkdir -p $HOME/mailg-deploy'
          scp -r deploy/gcp/* ${{ env.VM_USER }}@${{ env.VM_HOST }}:~/mailg-deploy/
          echo "Verifying files on remote VM..."
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} 'ls -la $HOME/mailg-deploy/'

      - name: Deploy to VM
        run: |
          BACKEND_IMG="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-backend:${{ github.sha }}"
          FRONTEND_IMG="${{ env.REGISTRY }}/${{ steps.registry-owner.outputs.owner }}/mailg-frontend:${{ github.sha }}"
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          GITHUB_ACTOR="${{ github.actor }}"
          
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} bash -s << EOF
            set -e
            cd \$HOME/mailg-deploy
            
            chmod +x deploy-from-registry.sh
            
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin || echo "GHCR login failed, continuing..."
            
            BACKEND_IMAGE="${BACKEND_IMG}" \
            FRONTEND_IMAGE="${FRONTEND_IMG}" \
            GITHUB_TOKEN="${GITHUB_TOKEN}" \
            GITHUB_ACTOR="${GITHUB_ACTOR}" \
            ./deploy-from-registry.sh
          EOF

      - name: Verify deployment
        run: |
          echo "Waiting for services to be ready..."
          sleep 15
          
          # Simple health check
          curl -fsS --max-time 30 "http://${{ env.VM_HOST }}:${{ env.BACKEND_PORT }}/health" || echo "Backend health check pending..."
          curl -fsS --max-time 30 "http://${{ env.VM_HOST }}:${{ env.FRONTEND_PORT }}/api/health" || echo "Frontend health check pending..."
          
          echo "✅ Manual deployment completed"

      - name: Manual deployment summary
        if: always()
        run: |
          echo "## 🚀 Manual Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: http://${{ env.VM_HOST }}:${{ env.FRONTEND_PORT }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: http://${{ env.VM_HOST }}:${{ env.BACKEND_PORT }}" >> $GITHUB_STEP_SUMMARY
