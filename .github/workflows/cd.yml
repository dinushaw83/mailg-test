# =============================================================================
# CD Pipeline - Build, Push & Deploy
# =============================================================================
# Triggers: dev branch (push/merge)
# Purpose: Test → Build → Push to GHCR → Deploy to GCP VM
# =============================================================================

name: CD - Deploy

on:
  push:
    branches:
      - staging
      - develop
      - feature/prod-deployment-cd
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (emergency deploy only)'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs for the same branch
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel deployments

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  BACKEND_PORT: 8766
  FRONTEND_PORT: 3002
  # Secrets referenced
  VM_HOST: ${{ secrets.GCP_VM_HOST }}
  VM_USER: ${{ secrets.GCP_VM_USER }}

jobs:
  # ===========================================================================
  # Stage 1: Test & Validate
  # ===========================================================================
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.skip_tests != 'true'
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mailg
          POSTGRES_PASSWORD: mailg
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL to be ready
        run: |
          python -c "
          import time
          import psycopg2
          max_attempts = 30
          for i in range(max_attempts):
              try:
                  conn = psycopg2.connect(
                      host='localhost',
                      port=5432,
                      user='mailg',
                      password='mailg',
                      database='postgres'
                  )
                  conn.close()
                  print('PostgreSQL is ready!')
                  break
              except psycopg2.OperationalError:
                  if i < max_attempts - 1:
                      print(f'Waiting for PostgreSQL... ({i+1}/{max_attempts})')
                      time.sleep(2)
                  else:
                      raise
          "

      - name: Run tests
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: postgresql+psycopg2://mailg:mailg@localhost:5432/postgres
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -x

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend-cd
        continue-on-error: true

  test-frontend:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build verification
        run: npm run build
        env:
          CI: true

      - name: Run tests
        run: npm run test --if-present || echo "No tests configured"
        continue-on-error: true

  # ===========================================================================
  # Stage 2: Build & Push to GHCR
  # ===========================================================================
  build-backend:
    name: 📦 Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-backend, test-frontend]
    if: |
      always() &&
      (needs.test-backend.result == 'success' || github.event.inputs.skip_tests == 'true') &&
      (needs.test-frontend.result == 'success' || github.event.inputs.skip_tests == 'true')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set registry owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/mailg-backend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Output image info
        run: |
          echo "📦 Backend image pushed:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'

  build-frontend:
    name: 📦 Build Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-backend, test-frontend]
    if: |
      always() &&
      (needs.test-backend.result == 'success' || github.event.inputs.skip_tests == 'true') &&
      (needs.test-frontend.result == 'success' || github.event.inputs.skip_tests == 'true')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set registry owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/mailg-frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}

      - name: Output image info
        run: |
          echo "📦 Frontend image pushed:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'

  # ===========================================================================
  # Stage 3: Deploy to GCP VM
  # ===========================================================================
  deploy:
    name: 🚀 Deploy to GCP
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    needs: [build-backend, build-frontend]
    if: always() && needs.build-backend.result == 'success' && needs.build-frontend.result == 'success'
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      environment: ${{ github.event.inputs.environment || 'staging' }}
      deployed: ${{ steps.health.outputs.health_status == 'success' }}
    # environment:
    #   name: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set registry owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Validate deployment secrets
        run: |
          echo "🔐 Validating deployment configuration..."
          
          if [ -z "${{ secrets.GCP_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::GCP_SSH_PRIVATE_KEY secret is not configured"
            exit 1
          fi
          
          if [ -z "${{ secrets.GCP_VM_HOST }}" ]; then
            echo "::error::GCP_VM_HOST secret is not configured"
            exit 1
          fi
          
          if [ -z "${{ secrets.GCP_VM_USER }}" ]; then
            echo "::error::GCP_VM_USER secret is not configured"
            exit 1
          fi
          
          echo "✅ All deployment secrets configured"
    

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          echo "VM_HOST: ${{ secrets.GCP_VM_HOST }} new"  # This will be masked if it's a secret
          mkdir -p ~/.ssh          
          ssh-keyscan -H ${{ secrets.GCP_VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Debug SSH setup
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          ssh-add -l || echo "No SSH keys loaded"
          echo "Testing connection..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts "${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}" 'echo "SSH connection successful" && whoami && pwd' || echo "Connection failed"
        env:
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}

      - name: Extract image tags from build outputs
        id: images
        run: |
          # docker/metadata-action with type=sha,prefix= uses short SHA (7 chars)
          FULL_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
          
          # Construct image tags using the short commit SHA (matches what docker/metadata-action pushed)
          BACKEND_IMAGE_TAG="${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/mailg-backend:${SHORT_SHA}"
          FRONTEND_IMAGE_TAG="${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/mailg-frontend:${SHORT_SHA}"
          
          echo "Full commit SHA: $FULL_SHA"
          echo "Short SHA (7 chars): $SHORT_SHA"
          echo "Backend image: $BACKEND_IMAGE_TAG"
          echo "Frontend image: $FRONTEND_IMAGE_TAG"
          
          # Set outputs
          echo "backend_image=$BACKEND_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$FRONTEND_IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Copy deployment files
        run: |
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} 'mkdir -p ~/mailg-deploy'
          scp -r deploy/gcp/* ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}:~/mailg-deploy/

      - name: Deploy containers
        env:
          SYSTEM_URL: ${{ vars.SYSTEM_URL }}
        run: |
          if [ -z "$SYSTEM_URL" ]; then
            echo "::error::SYSTEM_URL variable is not configured"
            exit 1
          fi
          
          # Set BACKEND_API_URL from SYSTEM_URL
          BACKEND_API_URL="${SYSTEM_URL}/api"
          
          echo "📦 Deploying with images:"
          echo "  Backend: ${{ steps.images.outputs.backend_image }}"
          echo "  Frontend: ${{ steps.images.outputs.frontend_image }}"
          echo "  Backend API URL: ${BACKEND_API_URL}"
          
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} bash -s << EOF
            set -e
            cd ~/mailg-deploy
            
            echo "🔑 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            echo "📥 Pulling new images..."
            docker pull "${{ steps.images.outputs.backend_image }}"
            docker pull "${{ steps.images.outputs.frontend_image }}"
            
            echo "🔄 Updating deployment..."
            chmod +x deploy-from-registry.sh
            
            BACKEND_IMAGE="${{ steps.images.outputs.backend_image }}" \
            FRONTEND_IMAGE="${{ steps.images.outputs.frontend_image }}" \
            BACKEND_API_URL="${BACKEND_API_URL}" \
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            GITHUB_ACTOR="${{ github.actor }}" \
            ./deploy-from-registry.sh
            
            echo "✅ Deployment completed"
          EOF

      - name: Health check
        id: health
        run: |
          SYSTEM_URL="${{ vars.SYSTEM_URL }}"
          
          if [ -z "$SYSTEM_URL" ]; then
            echo "::error::SYSTEM_URL variable is not configured"
            exit 1
          fi
          
          echo "⏳ Waiting for services to start..."
          sleep 15
          
          # Backend health check with retries
          echo "Checking backend health at ${SYSTEM_URL}/api/health..."
          for i in {1..30}; do
            if curl -sf --max-time 5 "${SYSTEM_URL}/api/health" > /dev/null; then
              echo "✅ Backend is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Backend health check failed after 30 attempts"
              exit 1
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 5
          done
          
          # Frontend health check with retries
          echo "Checking frontend health at ${SYSTEM_URL}/api/health..."
          for i in {1..30}; do
            if curl -sf --max-time 5 "${SYSTEM_URL}" > /dev/null; then
              echo "✅ Frontend is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Frontend health check failed after 30 attempts"
              exit 1
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 5
          done
          
          echo "health_status=success" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        run: |
          STATUS="✅ Success"
          [ "${{ steps.health.outputs.health_status }}" != "success" ] && STATUS="❌ Failed"
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Deployment Summary
          
          | Property | Value |
          |----------|-------|
          | **Status** | ${STATUS} |
          | **Environment** | ${{ github.event.inputs.environment || 'staging' }} |
          | **Branch** | \`${{ github.ref_name }}\` |
          | **Commit** | \`${{ github.sha }}\` |
          | **Deployed by** | @${{ github.actor }} |
          
          ### 📦 Docker Images
          - Backend: \`${{ steps.images.outputs.backend_image }}\`
          - Frontend: \`${{ steps.images.outputs.frontend_image }}\`
          
          ### 🔗 Access URLs
          - **Application**: ${{ vars.SYSTEM_URL }}
          - **API**: ${{ vars.SYSTEM_URL }}/api
          - **Health Check**: ${{ vars.SYSTEM_URL }}/api/health
          EOF

  # ===========================================================================
  # Stage 4: Deploy to Production (After Staging)
  # ===========================================================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy]
    if: |
      always() &&
      needs.deploy.result == 'success' &&
      needs.deploy.outputs.environment == 'staging' &&
      needs.deploy.outputs.deployed == 'true'
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set registry owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Validate deployment secrets
        run: |
          echo "🔐 Validating deployment configuration..."
          
          if [ -z "${{ secrets.GCP_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::GCP_SSH_PRIVATE_KEY secret is not configured"
            exit 1
          fi
          
          if [ -z "${{ secrets.GCP_VM_HOST }}" ]; then
            echo "::error::GCP_VM_HOST secret is not configured"
            exit 1
          fi
          
          if [ -z "${{ secrets.GCP_VM_USER }}" ]; then
            echo "::error::GCP_VM_USER secret is not configured"
            exit 1
          fi
          
          echo "✅ All deployment secrets configured"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.GCP_VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deployment files
        run: |
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} 'mkdir -p ~/mailg-deploy'
          scp -r deploy/gcp/* ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}:~/mailg-deploy/

      - name: Deploy containers
        env:
          PROD_SYSTEM_URL: ${{ vars.PROD_SYSTEM_URL }}
          SYSTEM_URL: ${{ vars.SYSTEM_URL }}
        run: |
          # Use PROD_SYSTEM_URL if available, otherwise fall back to SYSTEM_URL
          SYSTEM_URL="${PROD_SYSTEM_URL:-$SYSTEM_URL}"
          
          if [ -z "$SYSTEM_URL" ]; then
            echo "::error::SYSTEM_URL or PROD_SYSTEM_URL variable is not configured"
            exit 1
          fi
          
          # Set BACKEND_API_URL from SYSTEM_URL
          BACKEND_API_URL="${SYSTEM_URL}/api"
          
          # Use same image tags from staging deployment
          BACKEND_IMAGE="${{ needs.deploy.outputs.backend_image }}"
          FRONTEND_IMAGE="${{ needs.deploy.outputs.frontend_image }}"
          
          echo "📦 Deploying to production with images:"
          echo "  Backend: ${BACKEND_IMAGE}"
          echo "  Frontend: ${FRONTEND_IMAGE}"
          echo "  Backend API URL: ${BACKEND_API_URL}"
          echo "  System URL: ${SYSTEM_URL}"
          
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} bash -s << EOF
            set -e
            cd ~/mailg-deploy
            
            echo "🔑 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            echo "📥 Pulling production images..."
            docker pull "${BACKEND_IMAGE}"
            docker pull "${FRONTEND_IMAGE}"
            
            echo "🔄 Updating production deployment..."
            chmod +x deploy-from-registry.sh
            
            BACKEND_IMAGE="${BACKEND_IMAGE}" \
            FRONTEND_IMAGE="${FRONTEND_IMAGE}" \
            BACKEND_API_URL="${BACKEND_API_URL}" \
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            GITHUB_ACTOR="${{ github.actor }}" \
            ./deploy-from-registry.sh
            
            echo "✅ Production deployment completed"
          EOF

      - name: Health check
        id: health
        env:
          PROD_SYSTEM_URL: ${{ vars.PROD_SYSTEM_URL }}
          SYSTEM_URL: ${{ vars.SYSTEM_URL }}
        run: |
          # Use PROD_SYSTEM_URL if available, otherwise fall back to SYSTEM_URL
          SYSTEM_URL="${PROD_SYSTEM_URL:-$SYSTEM_URL}"
          
          if [ -z "$SYSTEM_URL" ]; then
            echo "::error::SYSTEM_URL or PROD_SYSTEM_URL variable is not configured"
            exit 1
          fi
          
          echo "⏳ Waiting for production services to start..."
          sleep 15
          
          # Backend health check with retries
          echo "Checking production backend health at ${SYSTEM_URL}/api/health..."
          for i in {1..30}; do
            if curl -sf --max-time 5 "${SYSTEM_URL}/api/health" > /dev/null; then
              echo "✅ Production backend is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Production backend health check failed after 30 attempts"
              exit 1
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 5
          done
          
          # Frontend health check with retries
          echo "Checking production frontend health at ${SYSTEM_URL}..."
          for i in {1..30}; do
            if curl -sf --max-time 5 "${SYSTEM_URL}" > /dev/null; then
              echo "✅ Production frontend is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Production frontend health check failed after 30 attempts"
              exit 1
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 5
          done
          
          echo "health_status=success" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        env:
          PROD_SYSTEM_URL: ${{ vars.PROD_SYSTEM_URL }}
          SYSTEM_URL: ${{ vars.SYSTEM_URL }}
        run: |
          SYSTEM_URL="${PROD_SYSTEM_URL:-$SYSTEM_URL}"
          STATUS="✅ Success"
          [ "${{ steps.health.outputs.health_status }}" != "success" ] && STATUS="❌ Failed"
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Production Deployment Summary
          
          | Property | Value |
          |----------|-------|
          | **Status** | ${STATUS} |
          | **Environment** | production |
          | **Branch** | \`${{ github.ref_name }}\` |
          | **Commit** | \`${{ github.sha }}\` |
          | **Deployed by** | @${{ github.actor }} |
          
          ### 📦 Docker Images
          - Backend: \`${{ needs.deploy.outputs.backend_image }}\`
          - Frontend: \`${{ needs.deploy.outputs.frontend_image }}\`
          
          ### 🔗 Access URLs
          - **Application**: ${SYSTEM_URL}
          - **API**: ${SYSTEM_URL}/api
          - **Health Check**: ${SYSTEM_URL}/api/health
          EOF

  # ===========================================================================
  # Stage 5: Verify Production
  # ===========================================================================
  verify-production:
    name: ✅ Verify Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-production]
    if: always() && needs.deploy-production.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Production verification
        env:
          PROD_SYSTEM_URL: ${{ vars.PROD_SYSTEM_URL }}
          SYSTEM_URL: ${{ vars.SYSTEM_URL }}
        run: |
          # Use PROD_SYSTEM_URL if available, otherwise fall back to SYSTEM_URL
          SYSTEM_URL="${PROD_SYSTEM_URL:-$SYSTEM_URL}"
          
          if [ -z "$SYSTEM_URL" ]; then
            echo "::error::SYSTEM_URL or PROD_SYSTEM_URL variable is not configured"
            exit 1
          fi
          
          echo "🔍 Starting comprehensive production verification..."
          echo "Target URL: ${SYSTEM_URL}"
          
          # Check 1: Backend health endpoint
          echo ""
          echo "1️⃣ Checking backend health endpoint..."
          HEALTH_RESPONSE=$(curl -sf --max-time 10 "${SYSTEM_URL}/api/health" || echo "FAILED")
          if [ "$HEALTH_RESPONSE" = "FAILED" ]; then
            echo "::error::Backend health check failed"
            exit 1
          fi
          echo "✅ Backend health endpoint is responding"
          
          # Check 2: Frontend accessibility
          echo ""
          echo "2️⃣ Checking frontend accessibility..."
          FRONTEND_RESPONSE=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "${SYSTEM_URL}" || echo "000")
          if [ "$FRONTEND_RESPONSE" != "200" ] && [ "$FRONTEND_RESPONSE" != "000" ]; then
            echo "::error::Frontend returned HTTP ${FRONTEND_RESPONSE}"
            exit 1
          fi
          if [ "$FRONTEND_RESPONSE" = "000" ]; then
            echo "::error::Frontend is not accessible"
            exit 1
          fi
          echo "✅ Frontend is accessible (HTTP ${FRONTEND_RESPONSE})"
          
          # Check 3: API endpoint response
          echo ""
          echo "3️⃣ Checking API endpoint response..."
          API_RESPONSE=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "${SYSTEM_URL}/api" || echo "000")
          if [ "$API_RESPONSE" = "000" ]; then
            echo "::error::API endpoint is not accessible"
            exit 1
          fi
          echo "✅ API endpoint is responding (HTTP ${API_RESPONSE})"
          
          # Check 4: Response time check
          echo ""
          echo "4️⃣ Checking response time..."
          RESPONSE_TIME=$(curl -sf --max-time 10 -o /dev/null -w "%{time_total}" "${SYSTEM_URL}/api/health" || echo "999")
          # Convert seconds to milliseconds using Python
          RESPONSE_TIME_MS=$(python3 -c "print(int(float('$RESPONSE_TIME') * 1000))")
          if [ "$RESPONSE_TIME_MS" -gt 5000 ]; then
            echo "::warning::Response time is slow: ${RESPONSE_TIME_MS}ms (threshold: 5000ms)"
          else
            echo "✅ Response time is acceptable: ${RESPONSE_TIME_MS}ms"
          fi
          
          # Check 5: SSL/TLS certificate (if HTTPS)
          echo ""
          echo "5️⃣ Checking SSL/TLS certificate..."
          if [[ "$SYSTEM_URL" == https://* ]]; then
            CERT_CHECK=$(echo | openssl s_client -connect $(echo "$SYSTEM_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||'):443 -servername $(echo "$SYSTEM_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||') 2>/dev/null | openssl x509 -noout -dates 2>/dev/null || echo "FAILED")
            if [ "$CERT_CHECK" = "FAILED" ]; then
              echo "::warning::Could not verify SSL certificate (may be normal for internal certs)"
            else
              echo "✅ SSL certificate is valid"
              echo "$CERT_CHECK" | head -2
            fi
          else
            echo "ℹ️  Not HTTPS, skipping SSL check"
          fi
          
          echo ""
          echo "✅ All production verification checks passed!"

      - name: Verification summary
        if: always()
        env:
          PROD_SYSTEM_URL: ${{ vars.PROD_SYSTEM_URL }}
          SYSTEM_URL: ${{ vars.SYSTEM_URL }}
        run: |
          SYSTEM_URL="${PROD_SYSTEM_URL:-$SYSTEM_URL}"
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Production Verification Summary
          
          | Property | Value |
          |----------|-------|
          | **Status** | ✅ All checks passed |
          | **Environment** | production |
          | **Verified URL** | ${SYSTEM_URL} |
          | **Verified by** | @${{ github.actor }} |
          
          ### Verification Checks
          - ✅ Backend health endpoint
          - ✅ Frontend accessibility
          - ✅ API endpoint response
          - ✅ Response time validation
          - ✅ SSL/TLS certificate (if HTTPS)
          EOF

  # ===========================================================================
  # Notification (Optional)
  # ===========================================================================
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [deploy, deploy-production, verify-production]
    if: always()
    
    steps:
      - name: Send notification
        run: |
          DEPLOY_ENV="${{ needs.deploy.outputs.environment }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          PROD_DEPLOY_STATUS="${{ needs.deploy-production.result }}"
          VERIFY_STATUS="${{ needs.verify-production.result }}"
          
          if [ "$DEPLOY_ENV" = "staging" ]; then
            if [ "$DEPLOY_STATUS" == "success" ]; then
              echo "🎉 Staging deployment successful!"
              if [ "$PROD_DEPLOY_STATUS" == "success" ] && [ "$VERIFY_STATUS" == "success" ]; then
                echo "🎉 Production deployment and verification successful!"
                # Add Slack/Discord/Email notification here if needed
                # curl -X POST -H 'Content-type: application/json' \
                #   --data '{"text":"✅ Staging and Production deployments succeeded!"}' \
                #   ${{ secrets.SLACK_WEBHOOK_URL }}
              elif [ "$PROD_DEPLOY_STATUS" != "skipped" ]; then
                echo "⚠️ Staging succeeded but production deployment had issues"
                # curl -X POST -H 'Content-type: application/json' \
                #   --data '{"text":"⚠️ Staging succeeded but production deployment had issues"}' \
                #   ${{ secrets.SLACK_WEBHOOK_URL }}
              fi
            else
              echo "❌ Staging deployment failed!"
              # curl -X POST -H 'Content-type: application/json' \
              #   --data '{"text":"❌ Staging deployment failed!"}' \
              #   ${{ secrets.SLACK_WEBHOOK_URL }}
            fi
          else
            # Direct production deployment (via workflow_dispatch)
            if [ "$DEPLOY_STATUS" == "success" ]; then
              echo "🎉 Production deployment successful!"
              # curl -X POST -H 'Content-type: application/json' \
              #   --data '{"text":"✅ Production deployment succeeded!"}' \
              #   ${{ secrets.SLACK_WEBHOOK_URL }}
            else
              echo "❌ Production deployment failed!"
              # curl -X POST -H 'Content-type: application/json' \
