name: Deploy to GCP VM

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'Image tag to deploy (leave empty for latest)'
        required: false
        type: string
  workflow_run:
    workflows: ["Build Docker Images"]
    types:
      - completed
    branches:
      - main
      - master

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  VM_HOST: ${{ secrets.GCP_VM_HOST }}
  VM_USER: ${{ secrets.GCP_VM_USER }}
  DEPLOY_DIR: ~/mailg-deploy

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image tags from build workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: image-tags
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ./

      - name: Set up GCP authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Read image tags
        id: image-tags
        run: |
          if [ -f image-tags.txt ]; then
            source image-tags.txt
            echo "backend_image=${BACKEND_IMAGE}" >> $GITHUB_OUTPUT
            echo "frontend_image=${FRONTEND_IMAGE}" >> $GITHUB_OUTPUT
            echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          else
            # Use provided tag or default to latest
            IMAGE_TAG="${{ github.event.inputs.image_tag || 'latest' }}"
            REGISTRY="${{ secrets.CONTAINER_REGISTRY_URL || 'gcr.io' }}"
            PROJECT_ID="${{ env.GCP_PROJECT_ID }}"
            echo "backend_image=${REGISTRY}/${PROJECT_ID}/mailg-backend:${IMAGE_TAG}" >> $GITHUB_OUTPUT
            echo "frontend_image=${REGISTRY}/${PROJECT_ID}/mailg-frontend:${IMAGE_TAG}" >> $GITHUB_OUTPUT
            echo "commit_sha=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Copy deployment files to VM
        run: |
          scp -r deploy/gcp/* ${{ env.VM_USER }}@${{ env.VM_HOST }}:${{ env.DEPLOY_DIR }}/
          scp docker-compose.yaml ${{ env.VM_USER }}@${{ env.VM_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.prod.yaml

      - name: Deploy to VM
        run: |
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} << EOF
            set -e
            cd ${{ env.DEPLOY_DIR }}
            
            # Export image tags
            export BACKEND_IMAGE_TAG="${{ steps.image-tags.outputs.backend_image }}"
            export FRONTEND_IMAGE_TAG="${{ steps.image-tags.outputs.frontend_image }}"
            export GCP_PROJECT_ID="${{ env.GCP_PROJECT_ID }}"
            
            # Make scripts executable
            chmod +x deploy-from-registry.sh
            
            # Run deployment script
            ./deploy-from-registry.sh
          EOF

      - name: Verify deployment
        run: |
          echo "Waiting for services to be ready..."
          sleep 10
          
          # Check backend health
          BACKEND_URL="http://${{ env.VM_HOST }}:8766/health"
          for i in {1..30}; do
            if curl -fsS "$BACKEND_URL" > /dev/null 2>&1; then
              echo "✓ Backend is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Backend health check failed"
              exit 1
            fi
            sleep 2
          done
          
          # Check frontend health
          FRONTEND_URL="http://${{ env.VM_HOST }}:3002/api/health"
          for i in {1..30}; do
            if curl -fsS "$FRONTEND_URL" > /dev/null 2>&1; then
              echo "✓ Frontend is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Frontend health check failed"
              exit 1
            fi
            sleep 2
          done

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Successful" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.image-tags.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image:** \`${{ steps.image-tags.outputs.backend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image:** \`${{ steps.image-tags.outputs.frontend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: http://${{ env.VM_HOST }}:3002" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: http://${{ env.VM_HOST }}:8766" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Health: http://${{ env.VM_HOST }}:8766/health" >> $GITHUB_STEP_SUMMARY

