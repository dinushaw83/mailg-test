name: Docker Compose Deploy
on:
  push:
    branches:
      - backend-setup

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, mira-vm]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          # Ensure directories exist before Docker mounts them
          mkdir -p databases backend/logs

          # Clean up any __pycache__ directories with sudo
          sudo find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

          # Fix ownership of entire work directory
          sudo chown -R $(whoami):$(whoami) .

          # Ensure permissions are correct for the runner user
          chmod -R 775 databases backend/logs

      - name: Clean up and Deploy with Docker Compose
        run: |
          # 1. Stop and remove current project containers
          docker-compose down

          # 2. Total system wipe (Careful: This affects the entire VM)
          docker system prune -a --volumes -f

          # 3. Build and Start
          # Force build to use the environment variables as build args
          docker-compose build
          docker-compose up -d

